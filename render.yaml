# Render Configuration - WebSocket Service Only
# ================================================
# NOTE: apps/web is deployed to Vercel, not Render
# NOTE: See apps/web/.env.local and Vercel dashboard for web app config
# 
# This file only configures the WebSocket backend service for Render

services:
  - type: web
    name: typefast-ws
    runtime: node
    plan: free
    root: apps/ws
    startCommand: node dist/index.js
    buildCommand: yarn install && yarn build
    envVars:
      - key: NODE_ENV
        value: production
      - key: WS_PORT
        value: "8080"
      - key: WS_HOST
        value: 0.0.0.0
    buildFilter:
      paths:
        - apps/ws/**
    autoDeployOnPush: true
