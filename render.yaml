# Render Configuration - Full Stack Deployment
# ================================================
# Deploys: Web (Next.js) + WebSocket
# PostgreSQL database created separately in Render dashboard
#
# Build Process:
#   1. yarn install - installs all workspaces (root, apps/web, apps/ws)
#   2. yarn web:build or yarn ws:build - uses root scripts to build each service
#
# Start Process:
#   Uses root workspace scripts that handle cd navigation automatically

services:
  # Next.js Web Application
  - type: web
    name: typefast-web
    runtime: node
    plan: free
    buildCommand: yarn install --production=false && yarn web:build
    startCommand: yarn start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: true
      - key: NEXTAUTH_SECRET
        sync: true
      - key: NEXTAUTH_URL
        value: https://typefast-web-yogd.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: https://typefast-ws.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: true
      - key: GOOGLE_CLIENT_SECRET
        sync: true

  # WebSocket Backend
  - type: web
    name: typefast-ws
    runtime: node
    plan: free
    buildCommand: yarn install --production=false && cd apps/ws && yarn build
    startCommand: cd apps/ws && yarn start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
