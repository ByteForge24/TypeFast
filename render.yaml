# Render Configuration - Full Stack Deployment
# ================================================
# Deploys: Web (Next.js) + WebSocket
# PostgreSQL database created separately in Render dashboard

services:
  # Next.js Web Application
  - type: web
    name: typefast-web
    runtime: node
    plan: free
    buildCommand: yarn install && yarn web:build
    startCommand: cd apps/web && yarn start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        value: https://typefast-web.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: https://typefast-ws.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  # WebSocket Backend
  - type: web
    name: typefast-ws
    runtime: node
    plan: free
    buildCommand: yarn && yarn ws:build
    startCommand: cd apps/ws && yarn start
    envVars:
      - key: NODE_ENV
        value: production
      - key: WS_PORT
        value: "10000"
      - key: WS_HOST
        value: 0.0.0.0
