# Render Configuration - Full Stack Deployment
# ================================================
# Deploys: Web (Next.js) + WebSocket + PostgreSQL Database
# Everything runs on Render, no external dependencies

services:
  # PostgreSQL Database
  - type: pserv
    name: typefast-db
    plan: free
    ipAllowList: []
    postgreSQL:
      version: 15

  # Next.js Web Application
  - type: web
    name: typefast-web
    runtime: node
    plan: free
    buildCommand: yarn install && yarn web:build
    startCommand: cd apps/web && yarn start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: typefast-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        value: https://typefast-web.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: https://typefast-ws.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
    routes:
      - type: http
        path: /
      - type: http
        path: /api
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    buildFilter:
      paths:
        - apps/web/**
        - package.json
        - yarn.lock

  # WebSocket Backend
  - type: web
    name: typefast-ws
    runtime: node
    plan: free
    buildCommand: yarn && yarn ws:build
    startCommand: cd apps/ws && yarn start
    envVars:
      - key: NODE_ENV
        value: production
      - key: WS_PORT
        value: "10000"
      - key: WS_HOST
        value: 0.0.0.0
    routes:
      - type: http
        path: /
    buildFilter:
      paths:
        - apps/ws/**
        - package.json
        - yarn.lock
